name: Gambit
on:
  pull_request:
    branches: [master]
jobs:
  windows-mingw-diag:
    name: "windows - MINGW64 diag3"
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: "autoconf git make tar texinfo mingw-w64-x86_64-gcc mingw-w64-x86_64-gdb mingw-w64-x86_64-libwinpthread-git"
        msystem: MINGW64
    - name: Build
      run: |
        ./configure --enable-c-opt=-O0 --enable-c-opt-rts=-O0 --enable-debug --enable-debug-c-backtrace --disable-multiple-threaded-vms
        echo "#undef HAVE_CLOCK_GETTIME" >> include/config.h
        make clean
        make -j`nproc` core
    - name: Repro exact make ut failure and capture gdb
      run: |
        cd tests
        echo "=== A. Backslash path single test BEFORE make ut ==="
        ../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -f ./run-unit-tests.scm 'unit-tests\15-misc\serdes.scm' || echo "A_EXIT=$?"
        echo "=== B. Full make ut (all 408 tests, NO test1..10) ==="
        make ut || echo "B_MAKE_UT_EXIT=$?"
        echo "=== C. ls -la tests/ after make ut ==="
        ls -la
        echo "=== D. Backslash path single test AFTER make ut ==="
        ../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -f ./run-unit-tests.scm 'unit-tests\15-misc\serdes.scm' || echo "D_EXIT=$?"
        echo "=== E. Re-run full make ut with gdb on 15-misc\\serdes.scm ==="
        sed 's|(test-using-mode file mode target)|(test-using-mode file (if (equal? (trim-filename file) "15-misc\\serdes.scm") (quote gsi-dbg) mode) target)|' run-unit-tests.scm > run-unit-tests-dbg.scm
        ../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -f ./run-unit-tests-dbg.scm || echo "E_EXIT=$?"
        echo "=== F. Run test1..test10 then serdes.scm ==="
        make test1 test2 test3 test4 test5 test6 test7 test8 test9 test10 || echo "F_T1_10_EXIT=$?"
        ls -la
        ../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -f ./run-unit-tests.scm 'unit-tests\15-misc\serdes.scm' || echo "F_SERDES_EXIT=$?"
        ../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -f ./run-unit-tests-dbg.scm || echo "F_UT_DBG_EXIT=$?"
