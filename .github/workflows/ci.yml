name: Gambit
on:
  pull_request:
    branches: [master]
jobs:
  windows-mingw-diag:
    name: "windows - MINGW64 diag4"
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: "autoconf git make tar texinfo mingw-w64-x86_64-gcc mingw-w64-x86_64-gdb mingw-w64-x86_64-libwinpthread-git"
        msystem: MINGW64
    - name: Build
      run: |
        ./configure --enable-c-opt=-O0 --enable-c-opt-rts=-O0 --enable-debug --enable-debug-c-backtrace --disable-multiple-threaded-vms
        echo "#undef HAVE_CLOCK_GETTIME" >> include/config.h
        make clean
        make -j`nproc` core
    - name: Catch exact gdb backtrace on unit-tests\15-misc\serdes.scm
      run: |
        cd tests
        echo "=== 1. Verify repro with run-unit-tests.scm -gsi ==="
        ../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -f ./run-unit-tests.scm 'unit-tests\15-misc\serdes.scm' || echo "UT1_EXIT=$?"
        echo "=== 2. Capture gdb via run-unit-tests.scm -gsi-dbg ==="
        ../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -f ./run-unit-tests.scm -gsi-dbg 'unit-tests\15-misc\serdes.scm' || echo "UT2_EXIT=$?"
        echo "=== 3. Capture direct gdb with exact inst-dirs and backslash path ==="
        gdb -batch \
          -ex "set pagination off" \
          -ex 'run -:debug-settings=-,io-settings=lu,~~=..,~~bin=../bin,~~lib=../lib,~~include=../include -f unit-tests\15-misc\serdes.scm' \
          -ex "bt 35" \
          -ex "frame 0" \
          -ex "list" \
          -ex "info locals" \
          -ex "info registers" \
          -ex "x/10i \$rip-16" \
          --args ../gsi/gsi.exe || true
        echo "=== 4. Capture direct gdb with exact run-unit-tests.scm inst-dirs ==="
        OPTS=$(../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -e '
          (let ((s "-:debug-settings=-,io-settings=lu"))
            (for-each (lambda (d)
              (let ((v (if (equal? d "") (##os-path-gambitdir) (##os-path-gambitdir-map-lookup d))))
                (if v (set! s (string-append s ",~~" d "=" v)))))
              (quote ("" "bin" "doc" "include" "info" "lib" "userlib" "instlib" "share")))
            (println s))')
        echo "EXACT_OPTS=$OPTS"
        gdb -batch \
          -ex "set pagination off" \
          -ex "run $OPTS -f unit-tests\\15-misc\\serdes.scm" \
          -ex "bt 35" \
          -ex "frame 0" \
          -ex "list" \
          -ex "info locals" \
          -ex "info registers" \
          -ex "x/10i \$rip-16" \
          --args ../gsi/gsi.exe || true
