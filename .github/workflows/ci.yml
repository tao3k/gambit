name: Gambit
on:
  pull_request:
    branches: [master]
jobs:
  windows-mingw-diag:
    name: "windows - MINGW64 diag2"
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: "autoconf git make tar texinfo mingw-w64-x86_64-gcc mingw-w64-x86_64-gdb mingw-w64-x86_64-libwinpthread-git"
        msystem: MINGW64
    - name: Build
      run: |
        ./configure --enable-c-opt=-O0 --enable-c-opt-rts=-O0 --enable-debug --enable-debug-c-backtrace --disable-multiple-threaded-vms
        echo "#undef HAVE_CLOCK_GETTIME" >> include/config.h
        make clean
        make -j`nproc` core
    - name: Repro and catch unmodified serdes.scm under gdb
      run: |
        cd tests
        echo "=== 1. Direct unmodified serdes.scm ==="
        ../gsi/gsi.exe -:debug-settings=-,io-settings=lu,~~=..,~~bin=../bin,~~lib=../lib,~~include=../include -f unit-tests/15-misc/serdes.scm || echo "DIRECT_UNMOD_EXIT=$?"
        echo "=== 2. Direct unmodified serdes.scm under GDB ==="
        gdb -batch \
          -ex "set pagination off" \
          -ex "run -:debug-settings=-,io-settings=lu,~~=..,~~bin=../bin,~~lib=../lib,~~include=../include -f unit-tests/15-misc/serdes.scm" \
          -ex "bt 30" \
          -ex "info locals" \
          -ex "info registers" \
          -ex "x/8i \$rip-16" \
          --args ../gsi/gsi.exe || true
        echo "=== 3. Exact run-unit-tests.scm -gsi on serdes.scm ==="
        ../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -f ./run-unit-tests.scm unit-tests/15-misc/serdes.scm || echo "UT_EXIT=$?"
        echo "=== 4. Exact run-unit-tests.scm -gsi-dbg on serdes.scm ==="
        ../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -f ./run-unit-tests.scm -gsi-dbg unit-tests/15-misc/serdes.scm || echo "UT_DBG_EXIT=$?"
        echo "=== 5. Exact run-unit-tests.scm on 15-misc/ ==="
        ../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -f ./run-unit-tests.scm unit-tests/15-misc || echo "UT_DIR_EXIT=$?"
        echo "=== 6. Exact make ut (check if prior test triggers it) ==="
        ../gsi/gsi.exe -:tl,~~bin=../bin,~~lib=../lib,~~include=../include -f ./run-unit-tests.scm -gsi-dbg unit-tests/15-misc/serdes.scm || true
