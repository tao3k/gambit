name: Gambit
on:
  pull_request:
    branches: [master]
jobs:
  windows-mingw-diag:
    name: "windows - MINGW64 diag"
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: "autoconf git make tar texinfo mingw-w64-x86_64-gcc mingw-w64-x86_64-gdb mingw-w64-x86_64-libwinpthread-git"
        msystem: MINGW64
    - name: Build
      run: |
        ./configure --enable-c-opt=-O0 --enable-c-opt-rts=-O0 --enable-debug --enable-debug-c-backtrace --disable-multiple-threaded-vms
        echo "#undef HAVE_CLOCK_GETTIME" >> include/config.h
        make clean
        make -j`nproc` core
    - name: Diagnose serdes.scm under gdb
      run: |
        cd tests
        awk '
          /^\(define t / { print "(println \"DBG-1 before-t\")" }
          /^\(for-each \(lambda \(obj\) \(test-equal obj \(serdes2/ { print "(println \"DBG-2 before-serdes2\")" }
          /^\(define circular / { print "(println \"DBG-3 before-circular\")" }
          /^\(define make-adder / { print "(println \"DBG-4 before-add10\")" }
          /^\(let\* \(\(predef-procedure/ { print "(println \"DBG-5 after-add10\")" }
          /^\(let\* \(\(equal-table/ { print "(println \"DBG-6 before-equal-table\")" }
          /^\(let\* \(\(eq-table/ { print "(println \"DBG-7 before-eq-table\")" }
          /^\(let\* \(\(cont / { print "(println \"DBG-8 before-cont\")" }
          /^\(let\* \(\(promise / { print "(println \"DBG-9 before-promise\")" }
          { print }
          END { print "(println \"DBG-10 DONE\")" }
        ' unit-tests/15-misc/serdes.scm > unit-tests/15-misc/serdes_dbg.scm
        echo "=== Direct run ==="
        ../gsi/gsi.exe -:debug-settings=-,io-settings=lu,~~=..,~~bin=../bin,~~lib=../lib,~~include=../include -f unit-tests/15-misc/serdes_dbg.scm || echo "DIRECT_EXIT=$?"
        echo "=== GDB run ==="
        gdb -batch \
          -ex "set pagination off" \
          -ex "run -:debug-settings=-,io-settings=lu,~~=..,~~bin=../bin,~~lib=../lib,~~include=../include -f unit-tests/15-misc/serdes_dbg.scm" \
          -ex "bt 25" \
          -ex "frame 0" \
          -ex "info locals" \
          -ex "info registers" \
          -ex "x/10i \$rip-16" \
          --args ../gsi/gsi.exe || true
